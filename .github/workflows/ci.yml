name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run moot: cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux for everything that does not need a Mac (a tenth of the cost of macOS minutes); the Mac app
# and the iPhone build run on macOS in their own workflows, only when their files change.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit, for the contract compatibility check.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The tests drive the window in Chromium; Electron itself is not needed.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @autopilot/desktop exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The iPhone bundle compiles with Hermes
        run: cd apps/mobile && CI=1 npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
      - name: JSON Schema is up to date
        run: pnpm schema && git diff --exit-code -- packages/contracts/schema
      - name: The contract stays compatible with installed apps
        run: node scripts/contract-compat.ts "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

  # The numbers behind "it should feel like the text is hardcoded": docs/PERFORMANCE.md.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @autopilot/desktop exec playwright-core install --with-deps chromium-headless-shell
      - name: The phone's bundle, for its size
        run: cd apps/mobile && CI=1 npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
      - run: pnpm perf
        env:
          IOS_BUNDLE_DIR: ${{ runner.temp }}/ios-bundle
