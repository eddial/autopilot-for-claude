name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The tests drive the window in Chromium; Electron itself is not needed.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @autopilot/desktop exec playwright-core install chromium-headless-shell
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The iPhone bundle compiles with Hermes
        run: cd apps/mobile && CI=1 npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
      - name: JSON Schema is up to date
        run: pnpm schema && git diff --exit-code -- packages/contracts/schema

  # The numbers behind "it should feel like the text is hardcoded": docs/PERFORMANCE.md.
  perf:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @autopilot/desktop exec playwright-core install chromium-headless-shell
      - name: The phone's bundle, for its size
        run: cd apps/mobile && CI=1 npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
      - run: pnpm perf
        env:
          IOS_BUNDLE_DIR: ${{ runner.temp }}/ios-bundle

  # The Mac app as a real Electron app: it starts the server and the window goes live on its feed.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autopilot/desktop build
      - name: Smoke test
        run: cd apps/desktop && AUTOPILOT_SMOKE=1 AUTOPILOT_DATA="$RUNNER_TEMP/ap" AUTOPILOT_SOCKET=/tmp/ap-smoke.sock npx electron .
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/ap/logs/server.log" || true

  # The iPhone app compiled for the simulator: the Swift module and the native configuration.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate the native project
        run: cd apps/mobile && CI=1 npx expo prebuild --platform ios --clean
      - name: Build for the simulator
        run: |
          cd apps/mobile/ios
          set -o pipefail
          xcodebuild -workspace Autopilot.xcworkspace -scheme Autopilot -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -80
